services:
  frontend:
    build: ./frontend
    container_name: musicjam-frontend
    ports:
      - "0.0.0.0:8000:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: musicjam-app
    expose:
      - "8000"
    environment:
      - DB_URL=http://db:8084
      - LLM_URL=http://llm:8082
      - YOUTUBE_URL=http://youtube:8081
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - HOST_IP=${HOST_IP:-}
    depends_on:
      - db
      - llm
      - youtube
    restart: unless-stopped

  youtube:
    build: ./backend/YouTube
    container_name: musicjam-youtube
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - PORT=8081
    restart: unless-stopped

  llm:
    build: ./backend/LLM
    container_name: musicjam-llm
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - OLLAMA_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - OLLAMA_AUTO_PULL=${OLLAMA_AUTO_PULL:-true}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  db:
    build: ./backend/Database
    container_name: musicjam-db
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - DATA_DIR=/app/database
    volumes:
      - ./database:/app/database
    restart: unless-stopped

volumes:
  ollama_models:
