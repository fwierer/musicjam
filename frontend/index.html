<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Jam</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="container py-3">
        <a class="logo" href="/">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Music Jam
        </a>
      </div>
    </header>

    <main class="container py-5">
      <h1 class="hero mb-3">One device plays.<br>Everyone picks the music.</h1>
      <p class="text-body-secondary fs-5 mb-5">
        One computer plays music from YouTube. Guests join with their phones and pick the songs.
      </p>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body p-4">
              <h2 class="h3">Host a jam</h2>
              <p class="text-body-secondary">This device will play the music. Best on a laptop or PC connected to speakers.</p>
              <button type="button" class="btn btn-primary w-100" id="start-jam">Start a jam</button>
              <p class="error mt-2 mb-0" id="start-error" hidden>Could not start a jam. Please try again.</p>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body p-4">
              <h2 class="h3">Join a jam</h2>
              <form id="join-form">
                <label class="form-label" for="join-code">Room code</label>
                <div class="d-flex gap-2">
                  <input class="form-control code-input" id="join-code" type="text" placeholder="K7MX2P"
                         maxlength="6" autocomplete="off" required>
                  <button class="btn btn-outline-primary px-4" type="submit">Join</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.getElementById("start-jam").addEventListener("click", async () => {
        // The server remembers the host through the userId cookie it sets here
        const response = await fetch("/api/room/create", { method: "POST" });
        if (!response.ok) {
          document.getElementById("start-error").hidden = false;
          return;
        }
        location.href = "/host.html";
      });

      document.getElementById("join-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = document.getElementById("join-code").value.trim().toUpperCase();
        location.href = "/guest.html?code=" + encodeURIComponent(code);
      });
    </script>
  </body>
</html>
