<!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>MusicJam</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
      <div id="nav"></div>
      <main class="container text-center py-5">
        <h1 class="mb-4">Jam together</h1>
        <button type="button" class="btn btn-dark btn-lg" id="create-session">Create Session</button>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="components/nav.js"></script>
      <script>
        document.getElementById("create-session").addEventListener("click", () => {
          // Placeholder room code until the backend creates real rooms
          const room = Math.random().toString(36).slice(2, 8).toUpperCase();
          window.location.href = "session.html?room=" + room;
        });
      </script>
    </body>
</html>
