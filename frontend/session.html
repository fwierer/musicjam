<!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>MusicJam Session</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
      <div id="nav"></div>
      <main class="container py-4">
        <div class="row g-4">
          <div class="col-lg-8">
            <h2 class="h5">Now Playing</h2>
            <div class="ratio ratio-16x9 rounded overflow-hidden bg-dark" id="player-frame">
              <div class="d-flex align-items-center justify-content-center text-white">
                Choose a song to start playback
              </div>
            </div>

            <section class="mt-4">
              <form class="input-group" id="song-search-form">
                <input class="form-control" id="song-search-input" type="search" placeholder="Search for a song or artist" autocomplete="off">
                <button class="btn btn-dark" type="submit">Search</button>
              </form>
              <div class="list-group mt-3" id="search-results"></div>
            </section>
          </div>
          <div class="col-lg-4">
            <div class="card mb-4 text-center">
              <div class="card-body">
                <h2 class="h5">Join this session</h2>
                <div id="qrcode" class="d-flex justify-content-center my-3"></div>
                <p class="mb-0">Room code: <strong id="room-code"></strong></p>
                <p class="mb-0 small text-body-secondary">You are: <span id="user-info"></span></p>
              </div>
            </div>
            <div class="card">
              <div class="card-header">Queue</div>
              <ul class="list-group list-group-flush" id="queue">
                <li class="list-group-item text-body-secondary">Nothing queued yet</li>
              </ul>
            </div>
          </div>
        </div>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
      <script src="components/nav.js"></script>
      <script src="js/youtube-search.js?v=genre-1"></script>
      <script src="https://www.youtube.com/iframe_api" async></script>
      <script>
        (async () => {
          const room = new URLSearchParams(location.search).get("room");
          const response = await fetch("/api/session");

          // No session, or session belongs to another room: send the user to the join page
          const session = response.ok ? await response.json() : null;
          if (!session || (room && session.roomCode !== room)) {
            window.location.href = room ? "/?join=" + encodeURIComponent(room) : "/";
            return;
          }

          document.getElementById("room-code").textContent = session.roomCode;
          document.getElementById("user-info").textContent =
            session.name + (session.isHost ? " (Host)" : "");

          // QR code leads to the start page with the room code filled in
          new QRCode(document.getElementById("qrcode"), {
            text: location.origin + "/?join=" + session.roomCode,
            width: 180,
            height: 180,
          });
        })();
      </script>
    </body>
</html>
