<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Jam – Join</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=genre-1" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="container py-3" style="max-width: 480px;">
        <a class="logo" href="/">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Music Jam
        </a>
      </div>
    </header>

    <main class="container py-5" style="max-width: 480px;">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-2">Join a jam</h1>
          <p class="text-body-secondary mb-4">Enter your name to join the room and start picking songs.</p>
          <form id="join-form">
            <label class="form-label" for="user-name">Your name</label>
            <input class="form-control mb-3" id="user-name" type="text" placeholder="e.g. Alex"
                   maxlength="30" autocomplete="nickname" required>
            <button class="btn btn-primary w-100" type="submit">Join</button>
          </form>
          <p class="error mt-2 mb-0" id="join-error" hidden></p>
        </div>
      </div>
    </main>

    <script src="/js/api.js?v=1"></script>
    <script src="/js/join.js?v=1"></script>
  </body>
</html>
