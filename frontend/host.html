<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Jam – Host</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=genre-1" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="container-xxl py-3 d-flex flex-wrap align-items-center gap-3">
        <a class="logo" href="/">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Music Jam
        </a>
        <span class="pill">You are the host</span>
        <span class="pill" id="room-genre"></span>
        <div class="ms-auto d-flex align-items-center gap-3">
          <span class="d-flex align-items-center gap-2 text-body-secondary">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span><strong class="text-body" id="guest-count">0</strong> guests connected</span>
          </span>
          <button type="button" class="btn btn-outline-danger" id="end-session">End session</button>
        </div>
      </div>
    </header>

    <main class="container-xxl py-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="ratio ratio-16x9 player" id="player-frame">
            <div id="player" class="d-flex align-items-center justify-content-center text-body-secondary">
              Waiting for a guest to pick a song
            </div>
          </div>

          <div class="card mt-4">
            <div class="card-body p-4 d-flex flex-wrap align-items-center gap-3">
              <div class="flex-grow-1">
                <p class="label">Now playing</p>
                <h2 class="song-title mb-1" id="song-title">Nothing yet</h2>
                <p class="text-body-secondary mb-0" id="song-meta"></p>
              </div>
              <button type="button" class="btn btn-primary px-4" id="start-playback" hidden>Start playback</button>
            </div>
          </div>
          <p class="error small mt-2" id="playback-status" role="status"></p>
          <section class="mt-4" aria-labelledby="request-heading">
            <h2 class="h4 mb-3" id="request-heading">Song requests</h2>
            <ul class="list-unstyled" id="song-requests"></ul>
          </section>
          <form id="search-form" class="mt-4">
            <h2 class="h4 mb-3"><label for="search-input">Pick a song</label></h2>
            <div class="d-flex gap-2">
              <input class="form-control" id="search-input" type="search" placeholder="Song or artist" autocomplete="off">
              <button class="btn btn-primary" type="submit">Search</button>
            </div>
          </form>
          <p class="text-body-secondary small mt-2" id="search-status" role="status"></p>
          <div id="results"></div>
        </div>

        <div class="col-lg-4">
          <div class="card text-center">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">Scan to join</h2>
              <div class="qr" id="qr-code"></div>
              <p class="text-body-secondary mt-3 mb-1">or enter the room code</p>
              <p class="room-code mb-2" id="room-code"></p>
              <p class="text-body-secondary small mb-0" id="join-url"></p>
            </div>
          </div>
          <section class="mt-4" aria-labelledby="queue-heading">
            <h2 class="h4 mb-3" id="queue-heading">Queue</h2>
            <ol class="list-unstyled mb-0" id="queue">
              <li class="text-body-secondary">Nothing queued yet</li>
            </ol>
          </section>

          <div class="card mt-4">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">Guests</h2>
              <ul class="member-list" id="member-list"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/js/queue.js?v=1"></script>
    <script src="/js/members.js?v=1"></script>
    <script src="/js/moderation.js?v=1"></script>
    <script src="/js/song-search.js?v=1"></script>
    <script src="/js/host.js?v=genre-1"></script>
  </body>
</html>
