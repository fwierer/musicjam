<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Jam</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=genre-1" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="container py-3 d-flex align-items-center justify-content-between" style="max-width: 560px;">
        <a class="logo" href="/">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Music Jam
        </a>
        <span class="pill"><span class="dot"></span>Room <span id="room-code"></span></span>
      </div>
    </header>

    <main class="container py-4" style="max-width: 560px;" id="jam">
      <p class="small text-body-secondary">Genre: <span id="room-genre"></span></p>
      <div class="card mb-4">
        <div class="card-body d-flex align-items-center gap-3">
          <img class="thumb" id="now-thumb" alt="">
          <div class="text-truncate">
            <p class="label">Now playing</p>
            <p class="fw-semibold mb-0 text-truncate" id="now-title">Nothing yet</p>
            <p class="small text-body-secondary mb-0" id="now-meta"></p>
          </div>
        </div>
      </div>

      <section class="mb-4" aria-labelledby="queue-heading">
        <h2 class="h4 mb-3" id="queue-heading">Queue</h2>
        <ol class="list-unstyled mb-0" id="queue">
          <li class="text-body-secondary">Nothing queued yet</li>
        </ol>
      </section>

      <section class="mb-4" aria-labelledby="request-heading">
        <h2 class="h4 mb-3" id="request-heading">Your requests</h2>
        <ul class="list-unstyled" id="song-requests"></ul>
      </section>

      <form id="search-form">
        <h2 class="h4 mb-3"><label for="search-input">Pick a song</label></h2>
        <div class="d-flex gap-2">
          <input class="form-control" id="search-input" type="search" placeholder="Song or artist" autocomplete="off">
          <button class="btn btn-primary" type="submit" aria-label="Search" style="width: 50px;">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
      </form>

      <p class="text-body-secondary small mt-2" id="search-status"></p>
      <div id="results"></div>
    </main>

    <main class="container py-5 text-center" style="max-width: 560px;" id="ended" hidden>
      <div class="ended-icon mb-4">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 40px; height: 40px;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M2 2l20 20"/></svg>
      </div>
      <h1 class="h2">You're no longer in this jam</h1>
      <p class="text-body-secondary mb-4">The host closed the jam or removed you from it. Thanks for listening.</p>
      <a class="btn btn-primary px-4" href="/">Start your own jam</a>
    </main>

    <script src="/js/queue.js?v=1"></script>
    <script src="/js/moderation.js?v=1"></script>
    <script src="/js/song-search.js?v=1"></script>
    <script src="/js/guest.js?v=genre-1"></script>
  </body>
</html>
